<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이메일 확인 — payLens</title>
  <style>
    body { margin: 0; padding: 0; background-color: #F8FAFC; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #0F172A; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(11, 37, 69, 0.10); }
    .header { background-color: #0B2545; padding: 28px 40px; text-align: center; }
    .logo-text { color: #FFFFFF; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-text span { color: #EE6C4D; }
    .body { padding: 36px 40px 28px; }
    h1 { font-size: 18px; font-weight: 700; color: #0B2545; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.7; color: #475569; margin: 0 0 20px; }
    .btn-wrap { text-align: center; margin: 28px 0; }
    .btn { display: inline-block; background-color: #EE6C4D; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 13px 36px; border-radius: 8px; letter-spacing: -0.2px; }
    .divider { border: none; border-top: 1px solid #E2E8F0; margin: 24px 0; }
    .link-box { background: #F8FAFC; border-radius: 8px; padding: 12px 16px; word-break: break-all; font-size: 12px; color: #475569; }
    .footer { background-color: #F8FAFC; padding: 20px 40px; text-align: center; font-size: 12px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="logo-text">pay<span>L</span>ens</div>
    </div>
    <div class="body">
      <h1>이메일 주소를 확인해 주세요</h1>
      <p>payLens에 가입해 주셔서 감사합니다.<br />아래 버튼을 눌러 이메일 주소를 인증하면 서비스 이용이 시작됩니다.</p>
      <div class="btn-wrap">
        <a href="{{ .ConfirmationURL }}" class="btn">이메일 인증하기</a>
      </div>
      <hr class="divider" />
      <p style="margin-bottom: 8px; font-size: 13px;">버튼이 작동하지 않으면 아래 링크를 복사해 브라우저에 붙여넣으세요.</p>
      <div class="link-box">{{ .ConfirmationURL }}</div>
      <hr class="divider" />
      <p style="font-size: 12px; color: #94A3B8; margin-bottom: 0;">본인이 가입하지 않으셨다면 이 이메일을 무시하셔도 됩니다. 링크는 24시간 후 만료됩니다.</p>
    </div>
    <div class="footer">© 2025 payLens. All rights reserved.</div>
  </div>
</body>
</html>
